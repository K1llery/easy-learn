name: Browser Tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # 与 package.json 中的 @playwright/test 版本同步，镜像已包含浏览器和系统依赖。
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; node24
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; packageManager pins pnpm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; node24
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 检查 Playwright 与镜像版本
        run: |
          node -e "if (require('@playwright/test/package.json').version !== '1.56.1') throw new Error('请同步更新浏览器测试镜像及版本检查。')"
      - run: pnpm build
      - run: pnpm build:workbench
      - run: pnpm test:e2e
        timeout-minutes: 10
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; node24
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
