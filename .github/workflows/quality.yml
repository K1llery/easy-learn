name: Code Quality
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; node24
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; packageManager pins pnpm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; node24
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  scripts-and-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; node24
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; packageManager pins pnpm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; node24
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6; node24
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-dev.txt
      - run: pnpm lint:go
      - run: pnpm format:go:check
      - run: pnpm lint:python
      - run: pnpm format:python:check
