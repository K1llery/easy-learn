name: Package Easy Learn
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.version.outputs.metadata }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; node24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; node24
        with:
          node-version: 24.16.0
      - name: 统一分配本次打包的构建版本
        id: version
        run: node scripts/version.mjs ci
  desktop:
    needs: version
    env:
      EASY_LEARN_BUILD_METADATA: ${{ needs.version.outputs.metadata }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-14, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; node24
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; node24; packageManager pins pnpm
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; node24
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6; node24
        with:
          go-version: 1.27.1
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:go
      - run: pnpm format:go:check
      - run: pnpm test
      - run: pnpm package:desktop ${{ matrix.target }}
      - run: pnpm test:desktop ${{ matrix.target }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; node24
        with:
          name: Easy-Learn-${{ matrix.target }}
          overwrite: true
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
  extension:
    needs: version
    env:
      EASY_LEARN_BUILD_METADATA: ${{ needs.version.outputs.metadata }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; node24
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; node24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5; node24
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm package:extension
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; node24
        with:
          name: Easy-Learn-extension
          overwrite: true
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
  browser-tests:
    needs: extension
    uses: ./.github/workflows/browser-tests.yml
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, extension, browser-tests]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
      run_id: ${{ format('{0}', github.run_id) }}
